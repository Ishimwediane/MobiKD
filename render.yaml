databases:
  - name: mobikd-db
    databaseName: mobikd
    user: mobikd_admin
    plan: free

services:
  - type: web
    name: mobikd-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mobikd-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
